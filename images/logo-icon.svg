<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132">

  <!--
    TrueForge Life icon — rebuilt from USPTO trademark specimen
    Flame drawn first (behind anvil). Anvil drawn last (covers flame base).
    Colors: Flame #D4342B · Anvil #265C5C · Heart #FFFFFF
  -->

  <!-- ── FLAME ─────────────────────────────────────────────────────── -->
  <!--
    3 peaks: tall center (y≈7), two flanking peaks (y≈30).
    Wide belly at mid-height. Base meets anvil face at y=90.
  -->
  <path d="
    M 60,90
    C 52,89 22,80 22,66
    C 22,53 30,48 32,42
    C 34,36 34,26 38,30
    C 41,33 46,42 51,47
    C 54,50 56,36 60,7
    C 64,36 66,50 69,47
    C 74,42 79,33 82,30
    C 86,26 86,36 88,42
    C 90,48 98,53 98,66
    C 98,80 68,89 60,90
    Z"
    fill="#D4342B"/>

  <!-- ── HEART ──────────────────────────────────────────────────────── -->
  <!--
    White cutout. Centered at x=60. Bumps at y≈40, point at y≈60.
    Sits below side peaks and well above anvil face.
  -->
  <path d="
    M 60,60
    C 56,56 47,50 47,44
    C 47,39 51,37 55,39.5
    C 57,41 58.5,43.5 60,45.5
    C 61.5,43.5 63,41 65,39.5
    C 69,37 73,39 73,44
    C 73,50 64,56 60,60
    Z"
    fill="white"/>

  <!-- ── ANVIL ──────────────────────────────────────────────────────── -->
  <!--
    Horn tip at (4,100). Face: x=14–106, y=90–104.
    Left foot: x=14–44. Right foot: x=76–106. Gap: x=44–76, y=104–124.
    Z closes (14,100) → (4,100) forming the horn bottom edge.
  -->
  <path d="
    M 4,100
    L 14,90
    L 106,90
    L 106,124
    L 76,124
    L 76,104
    L 44,104
    L 44,124
    L 14,124
    L 14,100
    Z"
    fill="#265C5C"/>

</svg>
